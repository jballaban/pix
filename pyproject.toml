[project]
name = "pix"
dynamic = ["version"]
description = "CLI tooling for personal media library management at terabyte scale"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "blake3>=0.4",
    "psutil>=5.9",
    # WPD/MTP device access for `pix import` (Windows-only). No stubs; wpd.py
    # types the COM objects as Any and suppresses pyright's import checks.
    "comtypes>=1.4 ; sys_platform == 'win32'",
]

[project.scripts]
pix = "pix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pix"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = false  # typer/yaml have permissive stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
