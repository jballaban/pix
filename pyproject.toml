[project]
name = "pix"
version = "0.1.0"
description = "CLI tooling for personal media library management at terabyte scale"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
pix = "pix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pix"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = false  # typer/yaml have permissive stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
