[project]
name = "pix"
dynamic = ["version"]
description = "A NAS-hosted photo and video library: ingest, process, and a web app to curate it"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "blake3>=0.4",
    "psutil>=5.9",
    # WPD/MTP device access for `pix import` (Windows-only). No stubs; wpd.py
    # types the COM objects as Any and suppresses pyright's import checks.
    "comtypes>=1.4 ; sys_platform == 'win32'",
]

[project.scripts]
pix = "pix.nas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pix"]

[dependency-groups]
dev = [
    # The app's stack, so its tests run in the dev environment. Deliberately not
    # a runtime dependency: the CLI never imports it, and the container pins it
    # in deploy/Dockerfile.
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    # The reloader uvicorn actually wants; without it it polls with
    # `StatReload`. It is not the fix for a dev server serving stale code —
    # that was orphaned workers (see deploy/README.md) — but detection is
    # immediate and exact rather than a filesystem sweep on a timer.
    "watchfiles>=0.21",
    "pytest>=8.0",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = false  # typer/yaml have permissive stubs

# Tests are intentionally loose: they white-box internal helpers (private access)
# and use untyped lambdas/args as fixtures. Relax only those "unknown/private"
# rules for tests/ — real type mismatches (reportArgumentType, etc.) still fire.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
