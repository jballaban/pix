#------------------------------------------------------------------------------
# pix ExifTool config — registers the `pix` XMP namespace.
#
# Loaded by passing `-config <this file>` to every exiftool invocation. Once
# registered, ExifTool recognizes XMP-pix:* tags for both reads and writes.
# See spec/tags.md → "Custom namespace" and "Field map".
#------------------------------------------------------------------------------

%Image::ExifTool::UserDefined = (
    'Image::ExifTool::XMP::Main' => {
        pix => {
            SubDirectory => {
                TagTable => 'Image::ExifTool::UserDefined::pix',
            },
        },
    },
);

%Image::ExifTool::UserDefined::pix = (
    GROUPS    => { 0 => 'XMP', 1 => 'XMP-pix', 2 => 'Other' },
    NAMESPACE => { 'pix' => 'http://pix.local/' },
    WRITABLE  => 'string',

    # Date / Event auto+override+previous (see spec/tags.md → Field map).
    DateAuto            => { },
    DateOverride        => { },
    DateAutoPrevious    => { },
    EventAuto           => { },
    EventOverride       => { },
    EventAutoPrevious   => { },

    # Merge fields: dedupe-consolidated values at the top of each auto
    # cascade (see spec/tags.md → Merge fields, spec/dedupe.md → Tag merge).
    MergeDate           => { },
    MergeEvent          => { },

    # System fields (see spec/tags.md → System fields).
    OriginalPath        => { },
    # Device-import provenance: "<serial>:<persistent-unique-id>" — the durable,
    # convert-surviving skip key (see spec/import.md → Ingestion).
    ImportId            => { },

    # Round-trip stamps (spec/nas-app.md §15): written into what pix itself
    # makes and hands out — renders, clips' cuts, stills — so a copy that
    # comes back through an import is known for what it is. SourceFile is the
    # master it came from as `folder/name`; ClipId and ClipRange say which
    # clip, and where in its source.
    SourceFile          => { },
    SourceId            => { },
    ClipId              => { },
    ClipRange           => { },

    # Face-region confirmed flag (per-region; placeholder for Phase 7).
    FaceConfirmed       => { },
);

1;  #end
