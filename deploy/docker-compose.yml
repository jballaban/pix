# pix app as a Synology Container Manager project (deploy/README.md).
#
# Lives at /volume1/apps/pix/docker-compose.yml, beside the image tars and the
# `src/` the container runs. The archive stays on its own share, /volume1/pix2.
#
# The image is built on the desktop and imported (README §1-2), so there is no
# `build:` here: the Atom need not build anything. Shipping a code change is a
# copy into /volume1/apps/pix/src and a restart; a new image is an import and
# the project's "build" (which re-creates the container on it).
services:
  pix:
    image: pix:latest
    container_name: pix
    restart: unless-stopped

    volumes:
      # The archive. Read-write because the app writes `.xmp` decisions into
      # master — it is the only writer there besides `upload` — and keeps its
      # own state beside it in /volume1/pix2/app (accounts, undo log, logs,
      # download hashes). The derived tiers it only reads.
      - /volume1/pix2:/volume1/pix2
      # The source it runs, shadowing the copy baked into the image, so that a
      # code change is a file copy rather than a rebuild. Without it the image
      # runs its baked copy.
      - /volume1/apps/pix/src:/app/src:ro

    environment:
      # Where the archive appears inside the container. The default in
      # const.py is a Windows UNC path, meaningless on Linux.
      PIX_SHARE: /volume1/pix2
      TZ: America/Toronto

    ports:
      # DSM's reverse proxy for pix.ballaban.ca points at localhost:8000.
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    # The Atom has four cores and the NAS has other jobs; leave it headroom.
    # A weight, not a cap: Synology's kernel has no CFS quota, so `cpus:` is
    # refused outright ("NanoCPUs can not be set"). Half the default share
    # yields to the NAS's own work only when the processor is contended.
    mem_limit: 1g
    cpu_shares: 512
